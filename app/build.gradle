plugins { id 'com.android.application' }
android {
    // Keep the installed identity and native namespace so existing libraries,
    // encrypted credentials and launcher shortcuts survive the 芭蕉 rename.
    namespace 'com.vocast.app'
    compileSdk 35
    defaultConfig { applicationId 'com.vocast.app'; minSdk 26; targetSdk 35; versionCode 89; versionName '0.8.19' }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
